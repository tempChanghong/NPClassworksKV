name: NPEP current three-repository acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Optional full NPEduTools SHA for replay
        type: string
        default: ''
      web_sha:
        description: Optional full NPClassworks SHA for replay
        type: string
        default: ''
      backend_sha:
        description: Optional full NPClassworksKV SHA for replay
        type: string
        default: ''

permissions:
  contents: read

jobs:
  current:
    # Merge the desktop provider workflow before enabling this caller.
    uses: tempChanghong/NPEduTools/.github/workflows/npep-current.yml@de2feb627d93e77f72e4d450cd1eb922c04b6b93
    with:
      desktop_sha: ${{ inputs.desktop_sha || (github.event_name == 'pull_request' && 'de2feb627d93e77f72e4d450cd1eb922c04b6b93') || '' }}
      web_sha: ${{ inputs.web_sha || (github.event_name == 'pull_request' && '129bf032210a45ff6ba3436b659f96a311843c3a') || '' }}
      backend_sha: ${{ inputs.backend_sha || '' }}
