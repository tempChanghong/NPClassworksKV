name: NPEP current three-repository acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Optional full NPEduTools SHA for replay
        type: string
        default: ''
      web_sha:
        description: Optional full NPClassworks SHA for replay
        type: string
        default: ''
      backend_sha:
        description: Optional full NPClassworksKV SHA for replay
        type: string
        default: ''

permissions:
  contents: read

jobs:
  current:
    # Merge the desktop provider workflow before enabling this caller.
    uses: tempChanghong/NPEduTools/.github/workflows/npep-current.yml@eee09d2f7998e9cddf44458f3031770d6d3556c5
    with:
      desktop_sha: ${{ inputs.desktop_sha || (github.event_name == 'pull_request' && 'eee09d2f7998e9cddf44458f3031770d6d3556c5') || '' }}
      web_sha: ${{ inputs.web_sha || (github.event_name == 'pull_request' && '74fe0d87d95e73f9ec1114b738901b2ec23fd13d') || '' }}
      backend_sha: ${{ inputs.backend_sha || '' }}
