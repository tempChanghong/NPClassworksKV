name: NPEP current three-repository acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Optional full NPEduTools SHA for replay
        type: string
        default: ''
      web_sha:
        description: Optional full NPClassworks SHA for replay
        type: string
        default: ''
      backend_sha:
        description: Optional full NPClassworksKV SHA for replay
        type: string
        default: ''

permissions:
  contents: read

jobs:
  current:
    # Merge the desktop provider workflow before enabling this caller.
    uses: tempChanghong/NPEduTools/.github/workflows/npep-current.yml@aa2cc5e716790395d9c65524895c1f0fb74f2546
    with:
      desktop_sha: ${{ inputs.desktop_sha || (github.event_name == 'pull_request' && 'aa2cc5e716790395d9c65524895c1f0fb74f2546') || '' }}
      web_sha: ${{ inputs.web_sha || (github.event_name == 'pull_request' && '091672bde11370e9bd67bda7e0507a3a3ad2370d') || '' }}
      backend_sha: ${{ inputs.backend_sha || '' }}
