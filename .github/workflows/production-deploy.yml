name: Deploy production server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npclassworks-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Request authenticated upgrade
        env:
          DEPLOY_AGENT_URL: ${{ secrets.DEPLOY_AGENT_URL }}
          DEPLOY_AGENT_SECRET: ${{ secrets.DEPLOY_AGENT_SECRET }}
        run: |
          test -n "$DEPLOY_AGENT_URL"
          test -n "$DEPLOY_AGENT_SECRET"
          body="$(jq -nc \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{action:"upgrade", repository:$repository, commit:$commit, runId:$runId}')"
          timestamp="$(date +%s)"
          nonce="$(openssl rand -hex 24)"
          signature="$(DEPLOY_BODY="$body" DEPLOY_TIMESTAMP="$timestamp" DEPLOY_NONCE="$nonce" node <<'NODE'
          const crypto = require("node:crypto");
          const body = process.env.DEPLOY_BODY;
          const bodyHash = crypto.createHash("sha256").update(body).digest("hex");
          process.stdout.write(crypto.createHmac("sha256", process.env.DEPLOY_AGENT_SECRET)
            .update(`${process.env.DEPLOY_TIMESTAMP}\n${process.env.DEPLOY_NONCE}\n${bodyHash}`)
            .digest("hex"));
          NODE
          )"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 30 \
            --request POST "$DEPLOY_AGENT_URL/v1/deploy" \
            --header 'Content-Type: application/json' \
            --header "X-NP-Deploy-Timestamp: $timestamp" \
            --header "X-NP-Deploy-Nonce: $nonce" \
            --header "X-NP-Deploy-Signature: sha256=$signature" \
            --data-binary "$body")"
          if [ "$http_code" -eq 200 ] && [ "$(jq -r '.ok // false' "$response_file")" = "true" ]; then
            cat "$response_file"
            exit 0
          fi
          if [ "$http_code" -ne 202 ]; then
            cat "$response_file"
            exit 1
          fi
          job_id="$(jq -er '.jobId' "$response_file")"
          status_path="$(jq -er '.statusPath' "$response_file")"
          status_token="$(jq -er '.statusToken' "$response_file")"
          echo "Deployment accepted: $job_id"

          for attempt in $(seq 1 1440); do
            if status_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --max-time 30 \
              --request GET "$DEPLOY_AGENT_URL$status_path" \
              --header "X-NP-Deploy-Status-Token: $status_token")"; then
              if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
                state="$(jq -r '.state // empty' "$response_file")"
                case "$state" in
                  succeeded)
                    cat "$response_file"
                    exit 0
                    ;;
                  failed)
                    cat "$response_file"
                    exit 1
                    ;;
                  queued|running)
                    echo "Deployment $job_id: $state"
                    ;;
                  *)
                    cat "$response_file"
                    exit 1
                    ;;
                esac
              else
                echo "Status request returned HTTP $status_code; retrying"
              fi
            else
              echo "Status request failed; retrying"
            fi
            sleep 5
          done

          echo "Deployment status timed out after 2 hours"
          exit 1
