name: Deploy production server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npclassworks-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Run isolated PostgreSQL integration tests
        timeout-minutes: 15
        run: pnpm test:database

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout the frontend explicitly: the triggering repository is the backend.
      - name: Checkout frontend main
        uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPClassworks
          ref: refs/heads/main
          persist-credentials: false
      - name: Checkout the triggering backend commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .contract-backend
          persist-credentials: false
      - name: Record and verify the tested revisions
        shell: bash
        run: |
          frontend_sha="$(git rev-parse HEAD)"
          backend_sha="$(git -C .contract-backend rev-parse HEAD)"
          test "$backend_sha" = "$GITHUB_SHA"
          mkdir -p test-results/fullstack-metadata
          jq -n --arg frontend "$frontend_sha" --arg backend "$backend_sha" \
            '{frontend: $frontend, backend: $backend}' \
            > test-results/fullstack-metadata/checkout-versions.json
          {
            printf '### Fullstack checkout pair\n\n'
            printf -- '- Frontend: %s\n' "$frontend_sha"
            printf -- '- Backend: %s\n' "$backend_sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .contract-backend
      - name: Test actual consumer and producer modules
        run: pnpm test:contracts
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test production PWA with real backend and disposable PostgreSQL
        run: pnpm test:e2e:fullstack
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-fullstack-test-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: [verify, fullstack]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Request authenticated upgrade
        env:
          DEPLOY_AGENT_URL: ${{ secrets.DEPLOY_AGENT_URL }}
          DEPLOY_AGENT_SECRET: ${{ secrets.DEPLOY_AGENT_SECRET }}
        run: |
          test -n "$DEPLOY_AGENT_URL"
          test -n "$DEPLOY_AGENT_SECRET"
          body="$(jq -nc \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{action:"upgrade", repository:$repository, commit:$commit, runId:$runId}')"
          timestamp="$(date +%s)"
          nonce="$(openssl rand -hex 24)"
          signature="$(DEPLOY_BODY="$body" DEPLOY_TIMESTAMP="$timestamp" DEPLOY_NONCE="$nonce" node <<'NODE'
          const crypto = require("node:crypto");
          const body = process.env.DEPLOY_BODY;
          const bodyHash = crypto.createHash("sha256").update(body).digest("hex");
          process.stdout.write(crypto.createHmac("sha256", process.env.DEPLOY_AGENT_SECRET)
            .update(`${process.env.DEPLOY_TIMESTAMP}\n${process.env.DEPLOY_NONCE}\n${bodyHash}`)
            .digest("hex"));
          NODE
          )"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 7200 \
            --request POST "$DEPLOY_AGENT_URL/v1/deploy" \
            --header 'Content-Type: application/json' \
            --header "X-NP-Deploy-Timestamp: $timestamp" \
            --header "X-NP-Deploy-Nonce: $nonce" \
            --header "X-NP-Deploy-Signature: sha256=$signature" \
            --data-binary "$body")"
          cat "$response_file"
          test "$http_code" -ge 200
          test "$http_code" -lt 300
