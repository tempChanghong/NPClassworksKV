name: npclassworks-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${INTEGRATION_POSTGRES_USER:-npclassworks_test}
      POSTGRES_PASSWORD: ${INTEGRATION_POSTGRES_PASSWORD:-npclassworks_test_only}
      POSTGRES_DB: ${INTEGRATION_POSTGRES_DB:-npclassworks_test}
    ports:
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Exercises restore.sh stop/start/readiness against an actual disposable service.
  # This is a lifecycle fixture; restored data is verified separately through Prisma.
  backend:
    image: node:22-alpine
    command: ["node", "-e", "require('http').createServer((req,res)=>{res.writeHead(req.url==='/ready'?200:404);res.end()}).listen(3000,'0.0.0.0')"]
